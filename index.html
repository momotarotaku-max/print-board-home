<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>プリントボード</title>
<link rel="apple-touch-icon" sizes="180x180" href="icon-180-v4.png">
<link rel="icon" type="image/png" sizes="180x180" href="icon-180-v4.png">
<meta name="apple-mobile-web-app-title" content="プリントボード">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#c47483">
<style>
  :root{--bg:#fff;--ink:#1f1e1c;--sub:#6b6965;--line:#e4e2dd;--tile:#f5f5f3;--accent:#a8475a}
  @media (prefers-color-scheme:dark){:root{--bg:#1a1a19;--ink:#efede8;--sub:#b3b0aa;--line:#363532;--tile:#2b2b29;--accent:#c2475a}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 "Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
  main{max-width:440px;margin:0 auto;padding:40px 20px;display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
  img{width:96px;height:96px;border-radius:22px}
  h1{font-size:20px;font-weight:500;margin:0}
  a.open{display:block;width:100%;padding:12px;border-radius:8px;background:var(--accent);color:#fff;text-decoration:none;font-weight:500}
  ol{text-align:left;background:var(--tile);border-radius:8px;padding:14px 14px 14px 34px;margin:0;width:100%;font-size:14px}
  p{margin:0;color:var(--sub);font-size:13px}
  .going ol,.going .hint{display:none}
</style>
</head>
<body>
<main>
  <img src="icon-180-v4.png" alt="">
  <h1>プリントボード</h1>
  <a class="open" id="open" href="#">プリントボードを開く</a>
  <ol>
    <li>Safari の共有ボタン（□↑）を押す</li>
    <li>iPhone は「ホーム画面に追加」、Mac は「Dock に追加」を選ぶ</li>
    <li>iPhone は「Webアプリとして開く」をオンのまま「追加」</li>
  </ol>
  <p class="hint">追加したアイコンから開くと、そのままプリントボードが表示されます。最初の1回だけ Google へのログインが必要です。</p>
</main>
<script>
  var APP = "https://print-board-efcf6.web.app/";
  document.getElementById("open").href = APP;
  // ホーム画面や Dock から「アプリとして」起動したときだけ本体へ移る。
  // 追加のときに Safari がアイコンを読みに来る読み込みはアプリ扱いにならないので、ここでは移らずアイコンを読める
  var asApp = navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
  if (asApp) {
    document.body.className = "going";
    location.replace(APP);
  }
</script>
</body>
</html>
